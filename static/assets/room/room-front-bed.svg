  aria-labelledby="room-title room-desc"
>
  <title id="room-title">Room with a front-view bed</title>
  <desc id="room-desc">
    Two walls and a wooden floor. A raised window has orange afternoon light.
    Simple rectangular furniture includes a bed on the left, a shelf against the
    back wall, and a solid-panel desk on the right. The chair, rug and cat
    corner sit between the bed and desk.
  </desc>
  <style>
    #morning:target ~ #window-sky {
      fill: #ccefe8;
    }
    #evening:target ~ #window-sky {
      fill: #f1cad0;
    }
    #night:target ~ #window-sky {
      fill: #8d8cb8;
    }
  </style>
  <g id="morning" />
  <g id="evening" />
  <g id="night" />
