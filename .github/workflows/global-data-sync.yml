name: Global data sync

on:
  push:
    branches:
      - main
    paths:
      - src/lib/data/**
      - scripts/generate-canonical-catalogue.mjs
      - tools/global_content_publisher/**
      - api/backend/content/**
      - api/requirements.txt
      - .github/workflows/global-data-sync.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: global-data-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install publisher dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Generate SvelteKit config
        run: pnpm exec svelte-kit sync

      - name: Validate catalogue data
        run: pnpm validate:data

      - name: Test publisher
        env:
          PYTHONPATH: api:.
          DATABASE_URL: sqlite+pysqlite://
          ENVIRONMENT: test
        run: python -m pytest api/tests/content

      - name: Read Terraform-managed database URL
        id: database
        env:
          STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
        run: |
          database_url="$(az staticwebapp appsettings list --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP_NAME" --query properties.DATABASE_URL --output tsv)"
          test -n "$database_url"
          echo "url=$database_url" >> "$GITHUB_OUTPUT"

      - name: Publish runtime content
        env:
          PYTHONPATH: api:.
          DATABASE_URL: ${{ steps.database.outputs.url }}
        run: python -m tools.global_content_publisher.cli
