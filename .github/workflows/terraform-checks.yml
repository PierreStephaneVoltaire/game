name: Terraform checks

on:
  push:
    paths:
      - infra/**
      - .github/workflows/terraform-checks.yml
  pull_request:
    branches:
      - main
    paths:
      - infra/**
      - .github/workflows/terraform-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate

      - name: Initialize CI-access Terraform
        run: terraform -chdir=infra/ci-access init -backend=false -input=false

      - name: Validate CI-access Terraform
        run: terraform -chdir=infra/ci-access validate

  plan:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_DATA_DIR: ${{ runner.temp }}/terraform-data
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      - name: Load remote backend configuration
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          test -n "$TF_BACKEND_CONFIG" || { echo '::error::TF_BACKEND_CONFIG is missing.'; exit 1; }
          umask 077
          printf '%s' "$TF_BACKEND_CONFIG" > "$RUNNER_TEMP/backend.tfbackend"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize existing remote state
        run: terraform -chdir=infra init -input=false -backend-config="$RUNNER_TEMP/backend.tfbackend"

      - name: Plan infrastructure changes
        run: terraform -chdir=infra plan -input=false -no-color -lock-timeout=60s -var-file=deployment.tfvars -out="$RUNNER_TEMP/deployment.tfplan"
