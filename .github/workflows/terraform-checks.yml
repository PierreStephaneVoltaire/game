name: Terraform infrastructure

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate

  apply:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-application-state
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_telemetry_ingest_principal_id: ${{ secrets.AZURE_DATABASE_OBJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      - name: Load remote backend configuration
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
        run: |
          test -n "$TF_BACKEND_CONFIG" || { echo '::error::TF_BACKEND_CONFIG is missing.'; exit 1; }
          umask 077
          printf '%s' "$TF_BACKEND_CONFIG" > "$RUNNER_TEMP/backend.tfbackend"
          printf 'TF_DATA_DIR=%s/terraform-data\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize existing remote state
        run: terraform -chdir=infra init -input=false -backend-config="$RUNNER_TEMP/backend.tfbackend"

      - name: Set up pnpm for trace measurement
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js for trace measurement
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Measure trace volume and verify infrastructure budget
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-kit sync
          node tools/measure_gameplay_traces.mjs "$RUNNER_TEMP/gameplay-volume.json"
          python3 tools/check_telemetry_budget.py "$RUNNER_TEMP/gameplay-volume.json"

      - name: Plan infrastructure changes
        run: terraform -chdir=infra plan -input=false -no-color -lock-timeout=5m -var-file=deployment.tfvars -out="$RUNNER_TEMP/deployment.tfplan"

      - name: Apply planned infrastructure changes
        run: terraform -chdir=infra apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/deployment.tfplan"
