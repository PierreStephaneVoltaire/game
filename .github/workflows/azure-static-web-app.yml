name: Azure Static Web App

on:
  push:
    branches:
      - main
      - static-web-hosting
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: azure-static-web-app
  cancel-in-progress: false

jobs:
  infrastructure:
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/terraform-checks.yml
    secrets: inherit

  build_test_and_deploy:
    needs: infrastructure
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Generate SvelteKit files
        run: pnpm exec svelte-kit sync

      - name: Run unit tests
        run: pnpm test

      - name: Run API tests
        env:
          PYTHONPATH: api
          DATABASE_URL: sqlite+pysqlite://
          ENVIRONMENT: test
        run: python -m pytest api/tests

      - name: Check Python API imports
        env:
          PYTHONPATH: api
          DATABASE_URL: sqlite+pysqlite://
          ENVIRONMENT: test
        run: python -c "import function_app"

      - name: Build static frontend
        run: pnpm build

      - name: Add Azure Static Web Apps configuration
        run: cp staticwebapp.config.json build/staticwebapp.config.json

      - name: Sign in to Azure
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure API secrets
        if: github.event_name == 'push'
        env:
          STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_DATABASE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_DATABASE_CLIENT_SECRET }}
        run: >-
          az staticwebapp appsettings set
          --name "$STATIC_WEB_APP_NAME"
          --resource-group "$RESOURCE_GROUP_NAME"
          --setting-names
          "DISCORD_CLIENT_SECRET=$DISCORD_CLIENT_SECRET"
          "SIGNING_SECRET=$SIGNING_SECRET"
          "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
          "AZURE_TENANT_ID=$AZURE_TENANT_ID"
          "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
          --output none

      - name: Deploy prebuilt frontend
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: build
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: false

      - name: Verify deployment and report app URL
        env:
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Azure returned no deployment URL. Check that staging environments are enabled for PR previews."
            exit 1
          fi
          printf 'App deployed: [%s](%s)\n' "$APP_URL" "$APP_URL" >> "$GITHUB_STEP_SUMMARY"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close Azure preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          skip_deploy_on_missing_secrets: true
