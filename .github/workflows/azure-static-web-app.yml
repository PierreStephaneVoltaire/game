name: Azure Static Web App

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-static-web-app
  cancel-in-progress: false

jobs:
  infrastructure:
    uses: ./.github/workflows/terraform-checks.yml
    secrets: inherit

  build_test_and_deploy:
    needs: infrastructure
    runs-on: ubuntu-latest
    env:
      STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
      API_ENVIRONMENT: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/static-web-hosting') && 'default' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Generate SvelteKit files
        run: pnpm exec svelte-kit sync

      - name: Run unit tests
        run: pnpm test

      - name: Run API tests
        env:
          PYTHONPATH: api
          DATABASE_URL: sqlite+pysqlite://
          ENVIRONMENT: test
        run: python -m pytest api/tests

      - name: Check Python API imports
        env:
          PYTHONPATH: api
          DATABASE_URL: sqlite+pysqlite://
          ENVIRONMENT: test
        run: python -c "import function_app"

      - name: Build static frontend
        run: pnpm build

      - name: Add Azure Static Web Apps configuration
        run: cp staticwebapp.config.json build/staticwebapp.config.json

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check API credentials
        env:
          AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          AZURE_DATABASE_CLIENT_ID: ${{ secrets.AZURE_DATABASE_CLIENT_ID }}
          AZURE_DATABASE_CLIENT_SECRET: ${{ secrets.AZURE_DATABASE_CLIENT_SECRET }}
          AZURE_DATABASE_OBJECT_ID: ${{ secrets.AZURE_DATABASE_OBJECT_ID }}
        run: |
          for key in AUTH_TEST_PASSWORD DISCORD_CLIENT_SECRET SIGNING_SECRET AZURE_DATABASE_CLIENT_ID AZURE_DATABASE_CLIENT_SECRET AZURE_DATABASE_OBJECT_ID; do
            test -n "${!key}" || { echo "::error::$key is missing."; exit 1; }
          done

      - name: Prepare API database
        env:
          PYTHONPATH: .:api
          AZURE_DATABASE_OBJECT_ID: ${{ secrets.AZURE_DATABASE_OBJECT_ID }}
        run: python -m tools.setup_api_database

      - name: Ensure runtime content is published
        env:
          PYTHONPATH: .:api
        run: |
          database_url="$(az staticwebapp appsettings list --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP_NAME" --query properties.DATABASE_URL --output tsv)"
          test -n "$database_url"
          DATABASE_URL="$database_url" python -m tools.global_content_publisher.cli --if-empty

      - name: Import companion quotes
        env:
          PYTHONPATH: .:api
        run: |
          quote_file="$RUNNER_TEMP/companion-quotes.json"
          az storage blob download --account-name legallydistinctvi95b050d --container-name companion-content --name companion-quotes.json --file "$quote_file" --auth-mode login --only-show-errors --output none
          database_url="$(az staticwebapp appsettings list --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP_NAME" --query properties.DATABASE_URL --output tsv)"
          test -n "$database_url"
          DATABASE_URL="$database_url" python -m tools.global_content_publisher.quotes "$quote_file"

      - name: Configure existing API environment before deployment
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          AZURE_DATABASE_CLIENT_ID: ${{ secrets.AZURE_DATABASE_CLIENT_ID }}
          AZURE_DATABASE_CLIENT_SECRET: ${{ secrets.AZURE_DATABASE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python -m tools.configure_api

      - name: Deploy prebuilt frontend
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: build
          api_location: api
          output_location: ''
          skip_app_build: true
          deployment_environment: ${{ env.API_ENVIRONMENT != 'default' && env.API_ENVIRONMENT || '' }}

      - name: Verify deployment and report app URL
        env:
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Azure returned no deployment URL. Check that staging environments are enabled for PR previews."
            exit 1
          fi
          printf 'App deployed: [%s](%s)\n' "$APP_URL" "$APP_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure deployed API environment
        env:
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          AZURE_DATABASE_CLIENT_ID: ${{ secrets.AZURE_DATABASE_CLIENT_ID }}
          AZURE_DATABASE_CLIENT_SECRET: ${{ secrets.AZURE_DATABASE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python -m tools.configure_api

      - name: Verify deployed authentication API
        timeout-minutes: 12
        env:
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: python -m tools.check_api

      - name: Verify account login and session persistence
        env:
          PYTHONPATH: .:api
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          AUTH_TEST_USERNAME: admin
          AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}
        run: python -m tools.check_login

      - name: Install browser for game startup check
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Streaming game startup
        env:
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          AUTH_TEST_USERNAME: admin
          AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}
        run: node tools/check_game.mjs
