name: Unit tests

on:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Generate SvelteKit config
        run: pnpm exec svelte-kit sync

      - name: Run unit tests
        run: pnpm test

      - name: Run API tests
        env:
          PYTHONPATH: api
          DATABASE_URL: sqlite+pysqlite://
          ENVIRONMENT: test
        run: python -m pytest api/tests

      - name: Check Alembic models match migrations
        working-directory: api
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite+pysqlite:////tmp/alembic-check.db
          ENVIRONMENT: test
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Check Python API imports
        env:
          PYTHONPATH: api
          DATABASE_URL: sqlite+pysqlite://
          ENVIRONMENT: test
        run: python -c "import function_app"
